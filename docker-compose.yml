version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: spectrapulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spectrapulse
      POSTGRES_USER: spectrapulse_user
      POSTGRES_PASSWORD: spectrapulse_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectrapulse_user -d spectrapulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: spectrapulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend-node-a:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spectrapulse-backend-node-a
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      NODE_ID: "node-a"
      REDIS_ADDR: "redis:6379"
      REDIS_CHANNEL: "telemetry:events"
      DB_URL: "postgres://spectrapulse_user:spectrapulse_password@postgres:5432/spectrapulse?sslmode=disable"
      GENERATE_METRICS: "true"
      GENERATE_INTERVAL_MS: "500"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-node-b:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spectrapulse-backend-node-b
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      PORT: "8080"
      NODE_ID: "node-b"
      REDIS_ADDR: "redis:6379"
      REDIS_CHANNEL: "telemetry:events"
      DB_URL: "postgres://spectrapulse_user:spectrapulse_password@postgres:5432/spectrapulse?sslmode=disable"
      GENERATE_METRICS: "true"
      GENERATE_INTERVAL_MS: "500"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spectrapulse-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8081"
      NEXT_PUBLIC_WS_URL: "ws://localhost:8081"
    depends_on:
      - backend-node-a

volumes:
  pgdata:
